<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="給族語老師的課堂抽卡器。自備中文與族語詞卡，洗牌翻面、接力計分。詞彙存在這台裝置，並與族語單字圈圈叉叉共用同一份清單。">
<meta property="og:title" content="族語詞卡抽卡器 · CalumAI Studio">
<meta property="og:description" content="給族語老師的課堂抽卡器。自備中文與族語詞卡，洗牌翻面、接力計分。詞彙存在這台裝置，並與族語單字圈圈叉叉共用同一份清單。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://calumai.com/flashcard/">
<meta property="og:image" content="https://calumai.com/assets/calumai-logo-mark.png">
<title>族語詞卡抽卡器 · CalumAI Studio</title>
<link rel="icon" href="/assets/calumai-logo-mark.png">
<style>
:root{--forest:#2f5d3a;--leaf:#5b8c4a;--moss:#a3b86c;--earth:#8a5a3b;--clay:#c97b4a;--sand:#f5ecd9;--paper:#fffaf0;--ink:#2b2a24;--muted:#7a7262;--r:22px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{background:#e8e3c8}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:linear-gradient(160deg,#f5ecd9 0%,#e8e3c8 60%,#d9e3c4 100%) fixed;color:var(--ink);display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;background:var(--forest);color:#fff;flex-wrap:wrap}
header h1{margin:0;font-size:1.4rem;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
nav{display:flex;gap:8px}
button{font:inherit;cursor:pointer;border:none;border-radius:14px;min-height:48px;padding:0 18px;font-size:1.05rem;transition:transform .1s,filter .15s}
button:active{transform:scale(.96)}
button:hover{filter:brightness(1.08)}
.tab{background:rgba(255,255,255,.15);color:#fff}
.tab.on{background:var(--sand);color:var(--forest);font-weight:700}
main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:20px}
.panel{background:var(--paper);border-radius:var(--r);box-shadow:0 6px 24px rgba(60,50,20,.12);padding:20px}
.hidden{display:none!important}
h2{margin:0 0 6px;color:var(--forest)}
.hint{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.rows{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding-right:4px}
.row{display:grid;grid-template-columns:36px 1fr 1fr 48px;gap:8px;align-items:center}
.row .n{color:var(--muted);text-align:right}
.row input{font:inherit;font-size:1.05rem;padding:10px 12px;border:2px solid #e2d8c0;border-radius:12px;background:#fff;min-height:48px;width:100%}
.row input:focus{outline:none;border-color:var(--leaf)}
.del{background:#f1e2d6;color:var(--earth);padding:0;font-size:1.3rem}
.colhead{display:grid;grid-template-columns:36px 1fr 1fr 48px;gap:8px;font-weight:700;color:var(--earth);margin-bottom:6px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pri{background:var(--forest);color:#fff}
.sec{background:var(--moss);color:var(--ink)}
.warm{background:var(--clay);color:#fff}
.ghost{background:#efe6d2;color:var(--earth)}
textarea{width:100%;min-height:120px;font:inherit;font-size:1rem;padding:12px;border:2px dashed var(--moss);border-radius:14px;background:#fff}
details{margin-top:16px}
summary{cursor:pointer;font-weight:700;color:var(--earth);min-height:40px;line-height:40px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--forest);color:#fff;padding:12px 22px;border-radius:30px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
/* draw */
#draw{display:flex;flex-direction:column;align-items:center;gap:18px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.progress{font-size:1.2rem;font-weight:700;color:var(--forest)}
.bar{flex:1;min-width:120px;height:12px;background:#e2d8c0;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),var(--moss));width:0;transition:width .4s}
.scene{width:min(92vw,760px);aspect-ratio:3/2;perspective:1600px;cursor:pointer}
.card{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:32px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;box-shadow:0 14px 40px rgba(40,50,20,.25);overflow:hidden}
.front{background:var(--paper);border:10px solid var(--leaf)}
.back{background:linear-gradient(145deg,var(--forest),#3f7148);color:#fff;transform:rotateY(180deg);border:10px solid var(--moss)}
.face .lbl{position:absolute;top:18px;left:24px;font-size:1rem;letter-spacing:.2em;opacity:.7}
.face .word{font-size:clamp(2.6rem,10vw,7rem);font-weight:800;line-height:1.15;word-break:break-word}
.back .sub{margin-top:14px;font-size:clamp(1.1rem,3vw,1.8rem);opacity:.85}
.face .tap{position:absolute;bottom:16px;font-size:.95rem;color:var(--muted)}
.back .tap{color:#d9e8c4}
.face::after{content:"";position:absolute;right:-40px;bottom:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(163,184,108,.25),transparent 70%)}
.done{background:var(--paper);border:10px dashed var(--clay)}
.done .word{font-size:clamp(2rem,7vw,4.5rem);color:var(--earth)}
.ctrls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.ctrls button{min-height:60px;font-size:1.25rem;padding:0 28px}
.score{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.team{border-radius:var(--r);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff}
.team.a{background:var(--earth)}.team.b{background:var(--leaf)}
.team .nm{font-weight:700;font-size:1.15rem}
.team .pt{font-size:2.6rem;font-weight:800;min-width:60px;text-align:center}
.team button{background:rgba(255,255,255,.25);color:#fff;min-width:56px;font-size:1.3rem;font-weight:700}
.scorehead{width:100%;display:flex;justify-content:space-between;align-items:center;color:var(--earth);font-weight:700}
.scorehead button{min-height:40px;font-size:.95rem}
footer{text-align:center;padding:14px;color:var(--muted);font-size:.85rem}
footer a{color:var(--earth);text-decoration:none}
@media (max-width:600px){
 header{padding:10px 14px}header h1{font-size:1.15rem}
 main{padding:12px}.panel{padding:14px}
 .row,.colhead{grid-template-columns:24px 1fr 1fr 44px;gap:6px}
 .scene{aspect-ratio:4/5}
 .score{grid-template-columns:1fr}
 .ctrls button{flex:1;padding:0 8px;font-size:1.05rem;white-space:nowrap}
 .face .word{font-size:clamp(2.6rem,15vw,5rem)}
 .done .word{font-size:2rem}
 .ctrls{width:100%}
 .team .pt{font-size:2rem}
}
:fullscreen body,:fullscreen{background:#efe8d4}
</style>
</head>
<body>
<header>
 <h1>🌿 族語詞卡抽卡器</h1>
 <nav><button class="tab" id="tabEdit">✏️ 詞卡編輯</button><button class="tab on" id="tabDraw">🎴 抽卡</button><button class="tab" id="fsBtn" title="全螢幕">⛶ 全螢幕</button></nav>
</header>
<main>
 <section id="edit" class="panel hidden">
  <h2>詞卡清單</h2>
  <p class="hint">左欄填中文、右欄填族語。內容會自動儲存在這台裝置的瀏覽器中。</p>
  <div class="colhead"><span></span><span>中文</span><span>族語</span><span></span></div>
  <div class="rows" id="rows"></div>
  <div class="btns">
   <button class="sec" id="addRow">＋ 新增一列</button>
   <button class="pri" id="goDraw">開始抽卡 ▶</button>
   <button class="ghost" id="loadSample">載入範例</button>
   <button class="ghost" id="clearAll">清空全部</button>
  </div>
  <details>
   <summary>📋 批次貼上（每行一組：中文,族語）</summary>
   <textarea id="bulk" placeholder="爸爸,請填入族語&#10;媽媽,請填入族語"></textarea>
   <div class="btns"><button class="sec" id="bulkAppend">加到清單後面</button><button class="warm" id="bulkReplace">取代整份清單</button><button class="ghost" id="bulkExport">把目前清單匯出到框內</button></div>
  </details>
 </section>
 <section id="draw" class="panel">
  <div class="topbar"><span class="progress" id="prog">0 / 0</span><div class="bar"><i id="barI"></i></div></div>
  <div class="scene" id="scene" role="button" aria-label="翻牌">
   <div class="card" id="card">
    <div class="face front"><span class="lbl">中文</span><div class="word" id="fw"></div><span class="tap">點一下或按空白鍵翻牌</span></div>
    <div class="face back"><span class="lbl">族語</span><div class="word" id="bw"></div><div class="sub" id="bs"></div><span class="tap">按「下一張」繼續</span></div>
   </div>
   <div class="card hidden" id="doneCard"><div class="face done"><div class="word">🎉 全部抽完了！</div><p class="hint" style="font-size:1.2rem;margin-top:12px">要重新洗牌再玩一輪嗎？</p></div></div>
  </div>
  <div class="ctrls">
   <button class="sec" id="flipBtn">🔄 翻牌</button>
   <button class="pri" id="nextBtn">下一張 ➜</button>
   <button class="warm" id="shuffleBtn">🔀 重新洗牌</button>
  </div>
  <div class="scorehead"><span>🏃 詞卡接力計分</span><button class="ghost" id="resetScore">分數歸零</button></div>
  <div class="score">
   <div class="team a"><span class="nm">A 隊</span><span class="pt" id="sA">0</span><span><button data-t="A" data-d="-1">−1</button> <button data-t="A" data-d="1">+1</button></span></div>
   <div class="team b"><span class="nm">B 隊</span><span class="pt" id="sB">0</span><span><button data-t="B" data-d="-1">−1</button> <button data-t="B" data-d="1">+1</button></span></div>
  </div>
 </section>
</main>
<footer>CalumAI Studio · <a href="https://calumai.com" target="_blank" rel="noopener">calumai.com</a></footer>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const KEY='zuyuCards.v1',SKEY='zuyuScore.v1';
const SAMPLE=['爸爸','媽媽','水','山','吃飯','太陽','朋友','謝謝','你好','老師'].map(z=>({zh:z,zy:'請填入族語'}));
let words=load(KEY)||SAMPLE.map(o=>({...o}));
let score=load(SKEY)||{A:0,B:0};
let deck=[],pos=-1;
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(words))}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1600)}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderRows(){
 $('rows').innerHTML=words.map((w,i)=>`<div class="row"><span class="n">${i+1}</span><input data-i="${i}" data-k="zh" value="${esc(w.zh)}" placeholder="中文"><input data-i="${i}" data-k="zy" value="${esc(w.zy)}" placeholder="族語"><button class="del" data-del="${i}" title="刪除">✕</button></div>`).join('');
}
$('rows').addEventListener('input',e=>{const t=e.target;if(t.dataset.k){words[t.dataset.i][t.dataset.k]=t.value;save();deck=[]}});
$('rows').addEventListener('click',e=>{const d=e.target.dataset.del;if(d!==undefined){words.splice(+d,1);save();renderRows();deck=[]}});
$('addRow').onclick=()=>{words.push({zh:'',zy:''});save();renderRows();const ins=$('rows').querySelectorAll('input');ins[ins.length-2].focus()};
$('loadSample').onclick=()=>{if(confirm('要用範例清單取代目前內容嗎？')){words=SAMPLE.map(o=>({...o}));save();renderRows();deck=[]}};
$('clearAll').onclick=()=>{if(confirm('確定清空全部詞卡？')){words=[];save();renderRows();deck=[]}};
function parse(t){return t.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(/\s*[,，\t]\s*/);return{zh:p[0]||'',zy:p.slice(1).join(', ')}}).filter(o=>o.zh)}
$('bulkAppend').onclick=()=>{const p=parse($('bulk').value);words=words.concat(p);save();renderRows();deck=[];toast(`已加入 ${p.length} 組`)};
$('bulkReplace').onclick=()=>{const p=parse($('bulk').value);if(!p.length)return toast('框內沒有內容');words=p;save();renderRows();deck=[];toast(`已取代為 ${p.length} 組`)};
$('bulkExport').onclick=()=>{$('bulk').value=words.map(w=>w.zh+','+w.zy).join('\n')};
function valid(){return words.filter(w=>w.zh.trim())}
function shuffle(){const v=valid();deck=v.map((_,i)=>i);for(let i=deck.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[deck[i],deck[j]]=[deck[j],deck[i]]}deck=deck.map(i=>v[i]);pos=-1;next()}
function next(){
 if(!deck.length){if(!valid().length){$('fw').textContent='請先新增詞卡';$('bw').textContent='';update();return}return shuffle()}
 const c=$('card');
 if(pos>=deck.length-1){pos=deck.length;c.classList.add('hidden');$('doneCard').classList.remove('hidden');update();return}
 pos++;const w=deck[pos];
 const show=()=>{$('fw').textContent=w.zh;$('bw').textContent=w.zy||'（尚未填入）';$('bs').textContent=w.zh};
 c.classList.remove('hidden');$('doneCard').classList.add('hidden');
 if(c.classList.contains('flip')){c.classList.remove('flip');setTimeout(show,350)}else show();
 update();
}
function update(){const n=deck.length,d=Math.min(pos+1,n);$('prog').textContent=`${d} / ${n}`;$('barI').style.width=n?(d/n*100)+'%':0}
function flip(){if(!$('doneCard').classList.contains('hidden'))return shuffle();$('card').classList.toggle('flip')}
$('scene').onclick=flip;$('flipBtn').onclick=flip;$('nextBtn').onclick=next;$('shuffleBtn').onclick=shuffle;
document.addEventListener('keydown',e=>{if($('draw').classList.contains('hidden')||/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();flip()}else if(e.code==='ArrowRight'||e.code==='Enter'){e.preventDefault();next()}});
function renderScore(){$('sA').textContent=score.A;$('sB').textContent=score.B;localStorage.setItem(SKEY,JSON.stringify(score))}
document.querySelectorAll('.team button').forEach(b=>b.onclick=()=>{score[b.dataset.t]=Math.max(0,score[b.dataset.t]+ +b.dataset.d);renderScore()});
$('resetScore').onclick=()=>{score={A:0,B:0};renderScore()};
function tab(t){$('edit').classList.toggle('hidden',t!=='edit');$('draw').classList.toggle('hidden',t!=='draw');$('tabEdit').classList.toggle('on',t==='edit');$('tabDraw').classList.toggle('on',t==='draw');if(t==='draw'&&!deck.length)shuffle()}
$('tabEdit').onclick=()=>tab('edit');$('tabDraw').onclick=()=>tab('draw');$('goDraw').onclick=()=>{deck=[];tab('draw')};
$('fsBtn').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()};
renderRows();renderScore();tab('draw');
</script>
</body>
</html>
