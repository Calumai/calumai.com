<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="用 8 個點選關卡理解 AI 生圖提示詞，不必先寫長句子。">
  <meta name="theme-color" content="#147d7e">
  <meta property="og:title" content="AI 小畫家互動暖身場｜CALUMAI CLASS">
  <meta property="og:description" content="猜、加料、換場景、換鏡頭、換風格、找碴，再完成自己的第一幕提示詞。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://calumai.com/class/taipei-ai/2026-0904-picture-book/warmup/">
  <title>AI 小畫家互動暖身場｜CALUMAI CLASS</title>
  <link rel="icon" href="/assets/calumai-logo-mark.png">
  <link rel="preload" href="../assets/fonts/iansui-course-display.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=20260904b">
</head>
<body>
  <a class="skip-link" href="#warmup-workspace">跳到暖身關卡</a>

  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="/class/taipei-ai/">CALUMAI <span>/ CLASS</span></a>
      <span class="header-label">AI 小畫家暖身</span>
      <a class="back-link" href="../">回到 9/4 課程</a>
    </div>
  </header>

  <main class="shell">
    <section class="intro" aria-labelledby="page-title">
      <div>
        <p>課程第一站</p>
        <h1 id="page-title">先讓 AI 猜錯一次</h1>
      </div>
      <span>跟著老師一起點選。8 關走完，你就會知道圖片描述該補什麼。</span>
    </section>

    <section class="workspace" id="warmup-workspace" aria-label="AI 小畫家八關暖身">
      <aside class="step-rail" aria-label="暖身關卡">
        <div class="progress-copy">
          <strong id="progress-count">1 / 8</strong>
          <span>目前關卡</span>
        </div>
        <ol id="step-list">
          <li><button type="button" data-warmup-step="0" aria-current="step"><b>1</b><span>AI 會通靈嗎？</span></button></li>
          <li><button type="button" data-warmup-step="1"><b>2</b><span>多一個線索</span></button></li>
          <li><button type="button" data-warmup-step="2"><b>3</b><span>換個場景</span></button></li>
          <li><button type="button" data-warmup-step="3"><b>4</b><span>要看多近？</span></button></li>
          <li><button type="button" data-warmup-step="4"><b>5</b><span>故事換衣服</span></button></li>
          <li><button type="button" data-warmup-step="5"><b>6</b><span>AI 偷加什麼？</span></button></li>
          <li><button type="button" data-warmup-step="6"><b>7</b><span>救一句短句</span></button></li>
          <li><button type="button" data-warmup-step="7"><b>8</b><span>我的第一幕</span></button></li>
        </ol>
      </aside>

      <article class="task-panel" id="task-panel">
        <div class="task-copy">
          <p>第 1 關</p>
          <h2>AI 會通靈嗎？</h2>
          <span>正在準備題目，請稍候。</span>
        </div>
      </article>

      <aside class="prompt-preview" aria-labelledby="preview-title">
        <p>一路累積</p>
        <h2 id="preview-title">目前的圖片描述</h2>
        <dl>
          <div><dt>角色</dt><dd id="preview-character">一隻棕色小飛鼠</dd></div>
          <div><dt>場景</dt><dd id="preview-scene">清晨的森林</dd></div>
          <div><dt>鏡頭</dt><dd id="preview-shot">中景</dd></div>
          <div><dt>畫風</dt><dd id="preview-style">溫暖水彩繪本</dd></div>
        </dl>
        <div class="preview-text" id="preview-text">提示詞會跟著你的選擇更新。</div>
      </aside>

      <div class="workspace-controls">
        <button class="control-button secondary" id="previous-step" type="button">上一關</button>
        <button class="control-button primary" id="next-step" type="button">下一關</button>
      </div>
    </section>

    <noscript><p class="noscript-note">請開啟瀏覽器 JavaScript，才能操作暖身關卡。</p></noscript>
  </main>

  <script src="app.js?v=20260904b"></script>
</body>
</html>
