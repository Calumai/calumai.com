scene_anchors:
  - scene_id: SCENE-PARK
    location: "虛構的一般社區公園"
    source_basis: [SRC-01]
    feature_origin: mixed_source_and_creative_decision
    permanent_props: ["木製長椅", "雨後濕潤步道", "低矮綠色灌木"]
    time_of_day: afternoon
    lighting: "雨後柔和漫射光"
    palette: ["雨灰", "葉綠", "暖木色"]
    reference_images:
      - "../../../assets/images/page-discovery.png"
    must_not_add: ["真實標誌", "地址", "大型遊樂設施"]
    unknown_or_hidden_features: []
    review_status: pending_human_review
  - scene_id: SCENE-CENTER
    location: "虛構活動中心服務桌"
    source_basis: [SRC-01]
    feature_origin: mixed_source_and_creative_decision
    permanent_props: ["淺木色服務桌", "無字軟木公告板", "窗戶"]
    time_of_day: afternoon
    lighting: "窗邊柔光"
    palette: ["淺木色", "奶油白", "灰藍"]
    reference_images:
      - "../../../assets/images/page-return.png"
    must_not_add: ["真實單位名稱", "電話", "地址", "品牌標誌"]
    unknown_or_hidden_features: []
    review_status: pending_human_review
  - scene_id: SCENE-STREET
    location: "虛構住家附近人行道"
    source_basis: [SRC-01]
    feature_origin: mixed_source_and_creative_decision
    permanent_props: ["小樹", "暖色窗光"]
    time_of_day: early_evening
    lighting: "細雨中的柔和暮光"
    palette: ["灰藍", "暖黃", "雨水反光"]
    reference_images: []
    must_not_add: ["真實門牌", "店家招牌", "車牌"]
    unknown_or_hidden_features: []
    review_status: pending_human_review

style:
  style_id: STYLE-WATERCOLOR
  style_name: "柔和透明水彩故事書"
  lines: "細而不完全封閉的深灰鉛筆線"
  materials: "透明水彩與可見紙張纖維"
  palette:
    primary: ["雨灰", "葉綠", "暖木色", "芥黃"]
    accent: ["雨傘紅", "小鴨黃", "側背包淺綠"]
    avoid: ["螢光色", "大面積純黑"]
  character_proportion: "兒童繪本的自然簡化比例"
  background_treatment: "背景保留足夠辨識物件，其餘柔化"
  lighting_and_shadow: "柔和漫射光、透明淡影"
  composition_habit: "單一焦點、清楚動作、保留約四分之一文字安全區"
  texture: "自然水彩紙纖維"
  mood: "溫暖、好奇、安心"
  must_avoid:
    - "特定在世創作者姓名或直接模仿要求"
    - "照片寫實或 3D 塑膠質感"
    - "圖內文字、偽文字、字母、數字、標誌、簽名與浮水印"

continuity_rules:
  use_same_character_ids: true
  use_same_scene_ids: true
  change_only_page_action_and_composition: true
  compare_pages_side_by_side: true

approval:
  art_owner: null
  culture_or_language_reviewer: not_applicable
  approved_at: null
  status: pending_human_review
