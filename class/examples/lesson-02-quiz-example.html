<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>學生測驗網頁範例</title>
  <style>
    :root{--ink:#152033;--muted:#627086;--blue:#3d8dff;--blue-soft:#eaf3ff;--good:#16805d;--bad:#c53c45;--paper:#fff;--bg:#f3f6fa}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans TC",sans-serif;line-height:1.6}.app{width:min(760px,calc(100% - 28px));margin:28px auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:16px}.brand{font-weight:900;letter-spacing:.04em}.status{color:var(--muted);font-size:.95rem}.card{background:var(--paper);border:1px solid #dce4ee;border-radius:24px;padding:clamp(22px,5vw,44px);box-shadow:0 18px 50px rgba(21,32,51,.08)}
    h1{font-size:clamp(2rem,7vw,3.5rem);line-height:1.08;margin:0 0 14px}h2{font-size:clamp(1.5rem,5vw,2.2rem);line-height:1.25;margin:0 0 18px}.lead{color:var(--muted);font-size:1.08rem}label{display:block;font-weight:800;margin:18px 0 7px}input{width:100%;font:inherit;padding:14px 16px;border:1px solid #cbd5e1;border-radius:12px}input:focus,button:focus{outline:3px solid rgba(61,141,255,.28);outline-offset:2px}button{border:0;border-radius:13px;padding:14px 20px;font:inherit;font-weight:900;cursor:pointer;background:var(--blue);color:white}button.secondary{background:#e7edf5;color:var(--ink)}button:disabled{opacity:.55;cursor:not-allowed}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
    .progress{height:10px;background:#e6ebf2;border-radius:99px;overflow:hidden;margin:6px 0 28px}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#73b7ff);transition:width .25s}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-weight:700;margin-bottom:8px}.options{display:grid;gap:12px}.option{width:100%;text-align:left;background:#f8fafc;color:var(--ink);border:2px solid #dbe3ed}.option:hover{border-color:var(--blue);background:var(--blue-soft)}.option.correct{border-color:var(--good);background:#e7f7f0}.option.wrong{border-color:var(--bad);background:#fff0f1}.feedback{margin-top:18px;padding:16px 18px;border-radius:14px;background:#f3f6fa}.feedback.good{border-left:6px solid var(--good)}.feedback.bad{border-left:6px solid var(--bad)}.score{font-size:clamp(3rem,14vw,6rem);font-weight:950;color:var(--blue);line-height:1;margin:18px 0}.review{margin-top:22px}.review article{padding:16px 0;border-top:1px solid #e0e6ee}.tag{display:inline-block;background:var(--blue-soft);color:#205fb6;border-radius:99px;padding:4px 10px;font-size:.84rem;font-weight:800}.hidden{display:none!important}@media(max-width:560px){.app{margin:14px auto}.card{border-radius:18px}.top{align-items:flex-start;flex-direction:column}.actions button{width:100%}}
  </style>
</head>
<body>
  <main class="app">
    <div class="top"><div class="brand">CALUMAI QUIZ LAB</div><div class="status" id="status">準備開始</div></div>
    <section class="card" id="startView"><span class="tag">第 2 堂範例</span><h1 id="quizTitle">AI 教學工具小測驗</h1><p class="lead" id="quizDescription"></p><label for="studentName">你的名字或暱稱</label><input id="studentName" maxlength="30" placeholder="例如：小明"><div class="actions"><button id="startBtn">開始挑戰</button></div></section>
    <section class="card hidden" id="quizView"><div class="meta"><span id="questionCount"></span><span id="scoreNow"></span></div><div class="progress"><i id="progressBar"></i></div><span class="tag" id="questionTag"></span><h2 id="questionText"></h2><div class="options" id="options"></div><div class="feedback hidden" id="feedback"></div><div class="actions"><button class="hidden" id="nextBtn">下一題</button></div></section>
    <section class="card hidden" id="resultView"><span class="tag">任務結算</span><h2 id="resultTitle"></h2><div class="score" id="finalScore"></div><p class="lead" id="resultMessage"></p><div class="actions"><button id="reviewBtn">查看錯題</button><button class="secondary" id="restartBtn">重新挑戰</button></div><div class="review hidden" id="review"></div></section>
  </main>
  <script>
    // ===== 從這裡開始修改測驗基本資料 =====
    const QUIZ_INFO={title:'AI 教學工具小測驗',description:'完成 5 題，看看你是否掌握「先做能用版本、再逐步升級」的核心觀念。'};
    // ===== 從這裡開始修改題目 =====
    const QUIZ_DATA=[
      {question:'製作第一版測驗時，最重要的是什麼？',options:['先加入排行榜','先確保完整作答流程','先做二十種動畫','先設計會員登入'],answer:1,explanation:'先讓開始、答題、回饋、計分與重玩都能正常完成，再逐步增加功能。',topic:'最小版本'},
      {question:'哪一個區域最適合集中放置題目資料？',options:['QUIZ_DATA','body 標籤名稱','瀏覽器網址列','CSS 顏色變數'],answer:0,explanation:'把題目集中在 QUIZ_DATA，可以降低修改教材時碰到其他程式的機會。',topic:'題庫資料'},
      {question:'答錯後，哪一種回饋最能幫助學習？',options:['只顯示紅色叉叉','立刻關閉測驗','提供答案與簡短解析','扣分但不說原因'],answer:2,explanation:'清楚的答案與解析能讓學生知道錯誤原因，下一次才有機會修正。',topic:'學習回饋'},
      {question:'要請 Gemini 增加新功能時，較穩定的做法是？',options:['一次要求十個功能','只說「幫我變厲害」','一次新增一項並重新測試','刪掉原始版本'],answer:2,explanation:'一次處理一項功能，並保留原本可用版本，較容易找到問題與復原。',topic:'Vibe Coding'},
      {question:'交換作品進行 Bug 狩獵的主要目的為何？',options:['比較誰的顏色漂亮','確認別人真的能操作','增加題目數量','把答案藏起來'],answer:1,explanation:'作品要由另一位使用者實際接手，才能發現作者自己沒有遇到的操作問題。',topic:'測試'}
    ];
    const $=id=>document.getElementById(id);const views=['startView','quizView','resultView'];let state={index:0,score:0,locked:false,answers:[]};$('quizTitle').textContent=QUIZ_INFO.title;$('quizDescription').textContent=QUIZ_INFO.description;
    function show(id){views.forEach(v=>$(v).classList.toggle('hidden',v!==id));window.scrollTo({top:0,behavior:'smooth'})}
    function start(){const name=$('studentName').value.trim();if(!name){alert('請先填寫名字或暱稱。');$('studentName').focus();return}state={index:0,score:0,locked:false,answers:[]};$('status').textContent=`${name} 正在挑戰`;show('quizView');render()}
    function render(){const q=QUIZ_DATA[state.index];state.locked=false;$('questionCount').textContent=`第 ${state.index+1} / ${QUIZ_DATA.length} 題`;$('scoreNow').textContent=`目前 ${state.score} 分`;$('progressBar').style.width=`${((state.index+1)/QUIZ_DATA.length)*100}%`;$('questionTag').textContent=q.topic;$('questionText').textContent=q.question;$('feedback').className='feedback hidden';$('nextBtn').classList.add('hidden');const box=$('options');box.innerHTML='';q.options.forEach((text,index)=>{const b=document.createElement('button');b.className='option';b.textContent=`${String.fromCharCode(65+index)}. ${text}`;b.onclick=()=>answer(index,b);box.appendChild(b)})}
    function answer(choice,button){if(state.locked)return;state.locked=true;const q=QUIZ_DATA[state.index];const correct=choice===q.answer;if(correct)state.score++;state.answers.push({question:q.question,choice:q.options[choice],correct:q.options[q.answer],isCorrect:correct,explanation:q.explanation});[...$('options').children].forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct')});if(!correct)button.classList.add('wrong');const f=$('feedback');f.className=`feedback ${correct?'good':'bad'}`;f.innerHTML=`<strong>${correct?'答對了！':'再看一次。'}</strong><br>${q.explanation}`;$('scoreNow').textContent=`目前 ${state.score} 分`;$('nextBtn').textContent=state.index===QUIZ_DATA.length-1?'查看結果':'下一題';$('nextBtn').classList.remove('hidden')}
    function next(){if(state.index<QUIZ_DATA.length-1){state.index++;render()}else finish()}
    function finish(){const percent=Math.round(state.score/QUIZ_DATA.length*100);$('status').textContent='挑戰完成';$('finalScore').textContent=`${percent}%`;$('resultTitle').textContent=`${$('studentName').value.trim()}，完成挑戰！`;$('resultMessage').textContent=percent>=80?'任務完成，可以進入下一關。':percent>=60?'再複習錯題，就快完成了。':'先查看解析，再重新挑戰。';$('review').classList.add('hidden');$('reviewBtn').classList.toggle('hidden',state.answers.every(a=>a.isCorrect));show('resultView')}
    function review(){const wrong=state.answers.filter(a=>!a.isCorrect);$('review').innerHTML=wrong.map((a,i)=>`<article><strong>錯題 ${i+1}｜${a.question}</strong><p>你的答案：${a.choice}<br>正確答案：${a.correct}</p><p>${a.explanation}</p></article>`).join('');$('review').classList.remove('hidden')}
    $('startBtn').onclick=start;$('nextBtn').onclick=next;$('reviewBtn').onclick=review;$('restartBtn').onclick=()=>{show('startView');$('status').textContent='準備重新挑戰'};
  </script>
</body>
</html>
