<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, '微軟正黑體', sans-serif;
      background-color: #f4f7f6;
      margin: 0; padding: 20px;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh;
    }
    .quiz-container {
      background: white; width: 100%; max-width: 400px;
      border-radius: 16px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      padding: 30px; box-sizing: border-box; text-align: center;
    }
    .header { font-size: 1.2rem; color: #7f8c8d; margin-bottom: 20px; }

    .play-btn {
      background-color: #43936C; color: white;
      border: none; border-radius: 50%;
      width: 80px; height: 80px; font-size: 30px;
      cursor: pointer; margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.1s;
    }
    .play-btn:active { transform: scale(0.95); }
    .play-btn:disabled { background-color: #bdc3c7; cursor: not-allowed; }

    .error-text { color: #e74c3c; font-size: 0.9rem; margin-bottom: 15px; font-weight: bold; }

    .options-grid {
      display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 20px;
    }
    .option-btn {
      background-color: #f8f9fa; border: 2px solid #e9ecef;
      padding: 15px; border-radius: 12px; font-size: 1.2rem; cursor: pointer;
      transition: all 0.2s; color: #2c3e50;
    }
    .option-btn:hover:not(:disabled) { border-color: #43936C; }
    .option-btn:disabled { cursor: default; }

    /* 答題回饋狀態 */
    .option-btn.correct { background-color: #d4edda; border-color: #28a745; color: #155724; }
    .option-btn.wrong { background-color: #f8d7da; border-color: #dc3545; color: #721c24; }

    .feedback {
      min-height: 60px; margin-bottom: 20px;
    }
    .indigenous-text { font-size: 1.8rem; font-weight: bold; color: #2c3e50; margin: 5px 0; }
    .example-text { font-size: 1rem; color: #7f8c8d; }

    .next-btn {
      background-color: #2c3e50; color: white; border: none;
      padding: 12px 24px; border-radius: 30px; font-size: 1rem;
      cursor: pointer; width: 100%; display: none;
    }

    .result-screen { display: none; }
    .score-text { font-size: 3rem; color: #43936C; font-weight: bold; margin: 20px 0; }

    button:focus-visible {
      outline: 3px solid #f4b942;
      outline-offset: 3px;
    }
  </style>
</head>
<body>

  <div class="quiz-container" id="quiz-screen">
    <div class="header">第 <span id="current-q-num">1</span> 題 / 共 <span id="total-q">0</span> 題</div>

    <div id="audio-error" class="error-text" role="status" aria-live="polite"></div>
    <button class="play-btn" id="play-btn" type="button" aria-label="播放本題音檔" onclick="playAudio()">🔊</button>
    <audio id="audio-player"></audio>

    <div class="options-grid" id="options-container"></div>

    <div class="feedback" id="feedback-container" style="visibility: hidden;">
      <div class="indigenous-text" id="fb-indigenous"></div>
      <div class="example-text" id="fb-example"></div>
    </div>

    <button class="next-btn" id="next-btn" type="button" onclick="loadNextQuestion()">下一題</button>
  </div>

  <div class="quiz-container result-screen" id="result-screen">
    <h2>測驗結束！</h2>
    <div class="score-text" id="final-score">100</div>
    <p>總得分</p>
    <button class="next-btn" type="button" style="display:block; margin-top:20px;" onclick="location.reload()">重新測驗</button>
  </div>

  <script>
    let allData = [];
    let quizQuestions = [];
    let currentIdx = 0;
    let score = 0;
    let hasAnswered = false;
    let audioRequestId = 0;

    window.onload = function() {
      document.getElementById('current-q-num').innerText = '載入中...';
      google.script.run
        .withSuccessHandler(initQuiz)
        .withFailureHandler(showQuizLoadError)
        .getQuizData();
    };

    function initQuiz(data) {
      allData = Array.isArray(data) ? data.filter(item => item && item.indigenous) : [];
      if (allData.length === 0) {
        showQuizLoadError(new Error('未找到題目，請檢查試算表內容。'));
        return;
      }

      quizQuestions = [...allData].sort(() => Math.random() - 0.5);
      document.getElementById('total-q').innerText = quizQuestions.length;
      loadQuestion();
    }

    function showQuizLoadError(error) {
      const message = error && error.message ? error.message : String(error || '未知錯誤');
      document.getElementById('current-q-num').innerText = '載入失敗';
      document.getElementById('audio-error').innerText = '⚠️ 題目載入失敗：' + message;
      document.getElementById('play-btn').disabled = true;
    }

    function loadQuestion() {
      hasAnswered = false;
      document.getElementById('current-q-num').innerText = currentIdx + 1;
      document.getElementById('feedback-container').style.visibility = 'hidden';
      document.getElementById('next-btn').style.display = 'none';

      const q = quizQuestions[currentIdx];

      // 每次換題先停止上一題，避免舊音檔或舊請求覆蓋新題目
      const player = document.getElementById('audio-player');
      const errorMsg = document.getElementById('audio-error');
      const playBtn = document.getElementById('play-btn');
      const requestId = ++audioRequestId;

      player.pause();
      player.removeAttribute('src');
      player.load();
      player.oncanplay = null;
      player.onerror = null;

      if (q.audioUrl) {
        errorMsg.innerText = '⏳ 音檔讀取中...';
        playBtn.disabled = true;
        playBtn.innerText = '⏳';

        google.script.run
          .withSuccessHandler(function(base64Data) {
            if (requestId !== audioRequestId) return;

            if (!base64Data) {
              showAudioError('音檔讀取失敗', requestId);
              return;
            }

            player.oncanplay = function() {
              if (requestId !== audioRequestId) return;
              errorMsg.innerText = '';
              playBtn.disabled = false;
              playBtn.innerText = '🔊';
            };
            player.onerror = function() {
              showAudioError('瀏覽器無法解碼這個音檔', requestId);
            };
            player.src = base64Data;
            player.load();
          })
          .withFailureHandler(function(error) {
            const message = error && error.message ? error.message : '後端讀取失敗';
            showAudioError(message, requestId);
          })
          .getAudioBase64(q.audioUrl);
      } else {
        errorMsg.innerText = '⚠️ 此題無音檔';
        playBtn.disabled = true;
        playBtn.innerText = '🔇';
      }

      // 生成選項（1 個正確 + 3 個隨機錯誤）
      let options = [q.chinese];
      let distractors = allData.filter(item => item.chinese !== q.chinese);
      distractors.sort(() => Math.random() - 0.5);

      for (let i = 0; i < 3 && i < distractors.length; i++) {
        if (!options.includes(distractors[i].chinese)) {
          options.push(distractors[i].chinese);
        }
      }
      options.sort(() => Math.random() - 0.5); // 選項洗牌

      // 渲染按鈕
      const container = document.getElementById('options-container');
      container.innerHTML = '';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(btn, opt, q);
        container.appendChild(btn);
      });
    }

    function showAudioError(message, requestId) {
      if (requestId !== audioRequestId) return;
      document.getElementById('audio-error').innerText = '⚠️ ' + message;
      document.getElementById('play-btn').disabled = true;
      document.getElementById('play-btn').innerText = '❌';
    }

    async function playAudio() {
      const player = document.getElementById('audio-player');
      const errorMsg = document.getElementById('audio-error');

      try {
        if (player.ended) player.currentTime = 0;
        await player.play();
        errorMsg.innerText = '';
      } catch (error) {
        errorMsg.innerText = '⚠️ 播放失敗，請重新載入音檔後再試。';
      }
    }

    function checkAnswer(btn, selectedOption, q) {
      if (hasAnswered) return;
      hasAnswered = true;

      const isCorrect = (selectedOption === q.chinese);
      const allBtns = document.querySelectorAll('.option-btn');

      allBtns.forEach(b => {
        b.disabled = true; // 鎖定所有選項
        if (b.innerText === q.chinese) {
          b.classList.add('correct'); // 正確答案標綠色
        } else if (b === btn && !isCorrect) {
          b.classList.add('wrong'); // 點錯的標紅色
        }
      });

      if (isCorrect) score += 100 / quizQuestions.length;

      // 顯示族語回饋
      document.getElementById('fb-indigenous').innerText = q.indigenous;
      document.getElementById('fb-example').innerText = q.example ? `例句：${q.example}` : "";
      document.getElementById('feedback-container').style.visibility = 'visible';
      document.getElementById('next-btn').style.display = 'block';
    }

    function loadNextQuestion() {
      currentIdx++;
      if (currentIdx < quizQuestions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('quiz-screen').style.display = 'none';
      document.getElementById('result-screen').style.display = 'block';
      document.getElementById('final-score').innerText = Math.round(score);
    }
  </script>
</body>
</html>
