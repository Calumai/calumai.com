<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="給族語老師的課堂圈圈叉叉。自備中文與族語單字，學生輪流念出族語後才能畫上符號。詞彙存在這台裝置，並與族語詞卡抽卡器共用同一份清單。">
<meta property="og:title" content="族語單字圈圈叉叉 · CalumAI Studio">
<meta property="og:description" content="給族語老師的課堂圈圈叉叉。自備中文與族語單字，學生輪流念出族語後才能畫上符號。詞彙存在這台裝置，並與族語詞卡抽卡器共用同一份清單。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://calumai.com/ox/">

<title>族語單字圈圈叉叉 · CalumAI Studio</title>
<link rel="icon" href="/assets/calumai-logo-mark.png">
<style>
:root{--forest:#2f5d3a;--leaf:#5b8c4a;--moss:#a3b86c;--earth:#8a5a3b;--clay:#c97b4a;--sand:#f5ecd9;--paper:#fffaf0;--ink:#2b2a24;--muted:#7a7262;--r:22px;--o:#c0603a;--x:#2f6d8a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{background:#e8e3c8}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:linear-gradient(160deg,#f5ecd9 0%,#e8e3c8 60%,#d9e3c4 100%) fixed;color:var(--ink);display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;background:var(--forest);color:#fff;flex-wrap:wrap}
header h1{margin:0;font-size:1.4rem;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
nav{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:none;border-radius:14px;min-height:48px;padding:0 18px;font-size:1.05rem;transition:transform .1s,filter .15s;white-space:nowrap}
button:active{transform:scale(.96)}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.45;cursor:not-allowed}
.tab{background:rgba(255,255,255,.15);color:#fff}
.tab.on{background:var(--sand);color:var(--forest);font-weight:700}
main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:20px}
.panel{background:var(--paper);border-radius:var(--r);box-shadow:0 6px 24px rgba(60,50,20,.12);padding:20px}
.hidden{display:none!important}
h2{margin:0 0 6px;color:var(--forest)}
.hint{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.rows{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding-right:4px}
.row{display:grid;grid-template-columns:36px 1fr 1fr 48px;gap:8px;align-items:center}
.row .n{color:var(--muted);text-align:right}
.row input{font:inherit;font-size:1.05rem;padding:10px 12px;border:2px solid #e2d8c0;border-radius:12px;background:#fff;min-height:48px;width:100%;min-width:0}
.row input:focus,.tname:focus{outline:none;border-color:var(--leaf)}
.del{background:#f1e2d6;color:var(--earth);padding:0;font-size:1.3rem}
.colhead{display:grid;grid-template-columns:36px 1fr 1fr 48px;gap:8px;font-weight:700;color:var(--earth);margin-bottom:6px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pri{background:var(--forest);color:#fff}
.sec{background:var(--moss);color:var(--ink)}
.warm{background:var(--clay);color:#fff}
.ghost{background:#efe6d2;color:var(--earth)}
textarea{width:100%;min-height:120px;font:inherit;font-size:1rem;padding:12px;border:2px dashed var(--moss);border-radius:14px;background:#fff}
details{margin-top:16px}
summary{cursor:pointer;font-weight:700;color:var(--earth);min-height:40px;line-height:40px}
.count{font-weight:700;color:var(--forest)}
.count.bad{color:var(--clay)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--forest);color:#fff;padding:12px 22px;border-radius:30px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1}
/* game */
#game{display:flex;flex-direction:column;align-items:center;gap:16px}
.score{width:100%;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.team{border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;gap:10px;color:#fff;border:4px solid transparent;transition:box-shadow .3s,transform .3s;min-width:0}
.team.o{background:var(--o)}.team.x{background:var(--x)}
.team.turn{border-color:#ffe9a8;box-shadow:0 0 0 4px rgba(255,220,120,.55),0 8px 20px rgba(0,0,0,.18);transform:translateY(-2px)}
.team .sym{font-size:2.4rem;font-weight:900;width:48px;text-align:center;flex:none}
.tname{flex:1;min-width:0;font:inherit;font-weight:700;font-size:1.2rem;color:#fff;background:rgba(255,255,255,.15);border:2px solid transparent;border-radius:10px;padding:6px 8px;min-height:44px}
.team .pt{font-size:2.6rem;font-weight:800;min-width:48px;text-align:center;flex:none;white-space:nowrap}
.team .pt small{font-size:.9rem;font-weight:700;margin-left:3px;opacity:.85}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--earth);font-weight:700;text-align:center;padding:0 6px}
.mid .lbl{font-size:.85rem;color:var(--muted);font-weight:400}
.mid .fs{font-size:1.6rem}
.turnline{font-size:clamp(1.2rem,2.6vw,1.7rem);font-weight:800;color:var(--forest);text-align:center;min-height:1.6em}
.turnline b.o{color:var(--o)}.turnline b.x{color:var(--x)}
.board{display:grid;gap:12px;width:min(100%,640px,calc(100vh - 340px));min-width:280px;aspect-ratio:1/1}
.board.n3{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.board.n4{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:10px}
.cell{position:relative;background:#fff;border:5px solid var(--moss);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;cursor:pointer;box-shadow:0 6px 14px rgba(60,50,20,.12);transition:transform .12s,border-color .2s,background .2s;overflow:hidden;min-height:0;min-width:0;font:inherit;color:var(--ink);container-type:size}
.cell:hover:not(.done){transform:translateY(-3px);border-color:var(--leaf)}
.cell .w{font-weight:800;line-height:1.15;text-align:center;word-break:break-word;font-size:clamp(1.1rem,5vw,2.6rem);font-size:clamp(.9rem,30cqmin,3.2rem)}
.n4 .cell .w{font-size:clamp(1rem,3.6vw,2rem);font-size:clamp(.8rem,24cqmin,2.4rem)}
.cell .mk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(3rem,12vw,8rem);font-size:68cqmin;line-height:1;opacity:.9;pointer-events:none;animation:pop .35s ease-out}
.n4 .cell .mk{font-size:68cqmin}
.cell.done{cursor:default}
.cell.done .w{opacity:.45;font-size:clamp(.7rem,13cqmin,1.3rem);position:absolute;bottom:6px;left:4px;right:4px}
.cell.mo{background:#fbe9df;border-color:var(--o)}.cell.mo .mk{color:var(--o)}
.cell.mx{background:#e1eef3;border-color:var(--x)}.cell.mx .mk{color:var(--x)}
.cell .fw{position:absolute;top:4px;right:8px;font-size:1.1rem}
.cell.win{animation:glow 1s ease-in-out infinite alternate;border-color:#e8b923;border-width:6px}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(232,185,35,.6)}to{box-shadow:0 0 0 10px rgba(232,185,35,.15),0 0 30px rgba(232,185,35,.9)}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:.9}}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ctrls button{min-height:56px;font-size:1.15rem;padding:0 22px}
.seg{display:inline-flex;background:#efe6d2;border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:44px;background:transparent;color:var(--earth);padding:0 14px}
.seg button.on{background:var(--forest);color:#fff;font-weight:700}
.gbar{display:flex;gap:12px 18px;flex-wrap:wrap;justify-content:center;align-items:center}
.opts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;color:var(--earth);font-weight:700}
.warnbox{background:#fbe9df;color:var(--earth);border-radius:16px;padding:14px 18px;text-align:center;font-weight:700}
/* modal */
.ov{position:fixed;inset:0;background:rgba(30,40,20,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mbox{background:var(--paper);border-radius:32px;border:10px solid var(--leaf);width:min(100%,820px);max-height:100%;overflow:auto;padding:24px 24px 20px;text-align:center;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mbox .who{font-size:1.2rem;font-weight:700;margin:0 0 6px}
.mbox .say{color:var(--muted);margin:0 0 8px;font-size:1.05rem}
.mbox .big{font-size:clamp(3rem,12vw,7.5rem);font-weight:900;line-height:1.1;color:var(--ink);word-break:break-word;margin:6px 0 10px}
.ans{min-height:84px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.ans .zy{background:linear-gradient(145deg,var(--forest),#3f7148);color:#fff;border-radius:20px;padding:12px 26px;font-size:clamp(1.8rem,6vw,3.6rem);font-weight:800;word-break:break-word;animation:pop .3s}
.ans .zy.empty{background:#efe6d2;color:var(--muted);font-size:1.3rem;font-weight:700}
.mbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mbtns button{min-height:64px;font-size:1.25rem;font-weight:700;padding:0 10px}
.ok{background:var(--leaf);color:#fff}
.soft{background:#e8b923;color:var(--ink)}
.no{background:#b5543a;color:#fff}
.reveal{background:var(--sand);color:var(--forest);border:3px solid var(--moss);font-weight:700;font-size:1.2rem;min-height:56px}
.xclose{position:absolute;top:8px;right:10px;background:transparent;color:var(--muted);font-size:1.6rem;min-height:44px;padding:0 10px}
/* win */
.wbox{border-color:#e8b923}
.wbox .big{font-size:clamp(2rem,8vw,5rem)}
.wbox .emo{font-size:1.3em;line-height:1.1}
.wbox .sub{font-size:1.3rem;color:var(--earth);margin:0 0 18px}
.wbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.wbtns button{min-height:60px;font-size:1.2rem;padding:0 26px}
.cf{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;z-index:15;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
footer{text-align:center;padding:14px;color:var(--muted);font-size:.85rem}
footer a{color:var(--earth);text-decoration:none}
@media (max-width:600px){
 header{padding:10px 14px}header h1{font-size:1.15rem}
 nav button{min-height:42px;padding:0 12px;font-size:.95rem}
 main{padding:10px}.panel{padding:12px}
 .row,.colhead{grid-template-columns:24px 1fr 1fr 44px;gap:6px}
 #game{gap:12px}
 .score{grid-template-columns:1fr 1fr;gap:8px}
 .mid{grid-column:1/-1;grid-row:2;flex-direction:row;gap:8px}
 .mid .fs{font-size:1.2rem}
 .team{padding:6px 8px;gap:4px;flex-wrap:wrap;justify-content:center}
 .team .sym{font-size:1.8rem;width:30px}
 .team .pt{font-size:2rem;min-width:30px}
 .tname{font-size:1rem;padding:4px 6px;min-height:38px;order:3;flex-basis:100%;text-align:center}
 .board{width:100%;min-width:0;gap:8px}
 .board.n4{gap:6px}
 .cell{border-width:4px;border-radius:14px;padding:4px}
 .cell .w{font-size:clamp(1.1rem,7vw,2rem)}
 .n4 .cell .w{font-size:clamp(.9rem,5vw,1.4rem)}
 .gbar{width:100%}
 .ctrls{width:100%;display:grid;grid-template-columns:1fr 1fr}
 .ctrls button{padding:0 6px;font-size:1rem;min-height:52px}
 .ctrls button:last-child:nth-child(odd){grid-column:1/-1}
 .mbox{padding:20px 14px 14px;border-width:7px;border-radius:24px}
 .mbtns{grid-template-columns:1fr}
 .mbox .big{font-size:clamp(3rem,17vw,5rem)}
 .mbtns button{min-height:58px}
}
:fullscreen body,:fullscreen{background:#efe8d4}
</style>
</head>
<body>
<header>
 <h1>⭕❌ 族語單字圈圈叉叉</h1>
 <nav><button class="tab" id="tabEdit">✏️ 單字編輯</button><button class="tab on" id="tabGame">🎯 開始遊戲</button><button class="tab" id="fsBtn" title="全螢幕">⛶ 全螢幕</button></nav>
</header>
<main>
 <section id="edit" class="panel hidden">
  <h2>單字清單</h2>
  <p class="hint">左欄填中文、右欄填族語。內容會自動儲存在這台裝置的瀏覽器中（與「族語詞卡抽卡器」共用同一份清單）。3×3 需要至少 9 個單字，4×4 需要至少 16 個。</p>
  <p class="hint">目前有效單字：<span class="count" id="cnt">0</span></p>
  <div class="colhead"><span></span><span>中文</span><span>族語</span><span></span></div>
  <div class="rows" id="rows"></div>
  <div class="btns">
   <button class="sec" id="addRow">＋ 新增一列</button>
   <button class="pri" id="goGame">開始遊戲 ▶</button>
   <button class="ghost" id="loadSample">載入範例</button>
   <button class="ghost" id="clearAll">清空全部</button>
  </div>
  <details>
   <summary>📋 批次貼上（每行一組：中文,族語）</summary>
   <textarea id="bulk" placeholder="爸爸,請填入族語&#10;媽媽,請填入族語"></textarea>
   <div class="btns"><button class="sec" id="bulkAppend">加到清單後面</button><button class="warm" id="bulkReplace">取代整份清單</button><button class="ghost" id="bulkExport">把目前清單匯出到框內</button></div>
  </details>
 </section>
 <section id="game" class="panel">
  <div class="score">
   <div class="team o" id="tO"><span class="sym">O</span><input class="tname" id="nO" maxlength="12" aria-label="O 隊名稱"><span class="pt" title="已贏局數"><span id="sO">0</span><small>勝</small></span></div>
   <div class="mid" title="老師放水次數"><span class="lbl">老師放水</span><span class="fs">😉 <span id="fsN">0</span></span><span class="lbl">次</span></div>
   <div class="team x" id="tX"><span class="sym">X</span><input class="tname" id="nX" maxlength="12" aria-label="X 隊名稱"><span class="pt" title="已贏局數"><span id="sX">0</span><small>勝</small></span></div>
  </div>
  <div class="turnline" id="turn"></div>
  <div class="warnbox hidden" id="warn"></div>
  <div class="board n3" id="board"></div>
  <div class="gbar"><div class="opts"><span>棋盤大小</span><div class="seg"><button id="sz3" class="on">3×3（連 3 格）</button><button id="sz4">4×4（連 4 格）</button></div></div>
  <div class="ctrls">
   <button class="warm" id="reshuffle">🔀 換一批單字</button>
   <button class="pri" id="nextRound">▶ 下一局</button>
   <button class="ghost" id="resetScore">🔄 重設比分</button>
  </div></div>
  <p class="hint" style="text-align:center;margin:0">玩法：輪到的隊伍點一格 → 把中文念成族語 → 念對了才能畫上自己的符號。先連成一線的隊伍獲勝！</p>
 </section>
</main>
<footer>CalumAI Studio · <a href="https://calumai.com" target="_blank" rel="noopener">calumai.com</a></footer>

<div class="ov hidden" id="modal" role="dialog" aria-modal="true">
 <div class="mbox">
  <button class="xclose" id="mClose" title="取消（不換人）">✕</button>
  <p class="who" id="mWho"></p>
  <p class="say">請用族語念出：</p>
  <div class="big" id="mZh"></div>
  <div class="ans" id="mAns"><button class="reveal" id="mReveal">👀 看答案</button></div>
  <div class="mbtns">
   <button class="ok" id="mOk">念對了 ✓</button>
   <button class="soft" id="mSoft">老師放水 😉</button>
   <button class="no" id="mNo">再試一次 ✗</button>
  </div>
 </div>
</div>

<div class="ov hidden" id="winOv" role="dialog" aria-modal="true">
 <div class="mbox wbox">
  <div class="big" id="wTitle"></div>
  <p class="sub" id="wSub"></p>
  <div class="wbtns"><button class="pri" id="wNext">▶ 下一局</button><button class="ghost" id="wLook">👀 看棋盤</button></div>
 </div>
</div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const KEY='zuyuCards.v1';      // 與「族語詞卡抽卡器」共用
const GKEY='zuyuOX.v1';        // 本遊戲自己的設定與比分
const SAMPLE=['爸爸','媽媽','哥哥','姊姊','水','山','河流','太陽','月亮','吃飯','朋友','謝謝','你好','老師','學校','房子'].map(z=>({zh:z,zy:'請填入族語'}));
const PH='請填入族語';
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function okList(a){return Array.isArray(a)&&a.every(o=>o&&typeof o.zh==='string')}
let stored=load(KEY);
let words=okList(stored)?stored.map(o=>({zh:o.zh,zy:typeof o.zy==='string'?o.zy:''})):SAMPLE.map(o=>({...o}));
let G=Object.assign({names:{O:'O 隊',X:'X 隊'},score:{O:0,X:0},fang:0,size:3,starter:'O'},load(GKEY)||{});
let st={cells:[],marks:[],turn:G.starter,over:false,cur:-1,fangCell:{}};
function save(){localStorage.setItem(KEY,JSON.stringify(words))}
function saveG(){localStorage.setItem(GKEY,JSON.stringify(G))}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function valid(){return words.filter(w=>w.zh.trim())}
/* ---------- editor ---------- */
function renderRows(){
 $('rows').innerHTML=words.map((w,i)=>`<div class="row"><span class="n">${i+1}</span><input data-i="${i}" data-k="zh" value="${esc(w.zh)}" placeholder="中文"><input data-i="${i}" data-k="zy" value="${esc(w.zy)}" placeholder="族語"><button class="del" data-del="${i}" title="刪除">✕</button></div>`).join('');
 renderCount();
}
function renderCount(){const n=valid().length,e=$('cnt');e.textContent=n+' 個'+(n<9?'（還差 '+(9-n)+' 個才能玩 3×3）':n<16?'（可玩 3×3；4×4 還差 '+(16-n)+' 個）':'（3×3、4×4 都可以玩）');e.classList.toggle('bad',n<9)}
let dirty=false;
$('rows').addEventListener('input',e=>{const t=e.target;if(t.dataset.k){words[t.dataset.i][t.dataset.k]=t.value;save();dirty=true;renderCount()}});
$('rows').addEventListener('click',e=>{const d=e.target.dataset.del;if(d!==undefined){words.splice(+d,1);save();dirty=true;renderRows()}});
$('addRow').onclick=()=>{words.push({zh:'',zy:''});save();renderRows();const ins=$('rows').querySelectorAll('input');ins[ins.length-2].focus()};
$('loadSample').onclick=()=>{if(confirm('要用範例清單取代目前內容嗎？')){words=SAMPLE.map(o=>({...o}));save();dirty=true;renderRows()}};
$('clearAll').onclick=()=>{if(confirm('確定清空全部單字？')){words=[];save();dirty=true;renderRows()}};
function parse(t){return t.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(/\s*[,，\t]\s*/);return{zh:p[0]||'',zy:p.slice(1).join(', ')}}).filter(o=>o.zh)}
$('bulkAppend').onclick=()=>{const p=parse($('bulk').value);words=words.concat(p);save();dirty=true;renderRows();toast(`已加入 ${p.length} 組`)};
$('bulkReplace').onclick=()=>{const p=parse($('bulk').value);if(!p.length)return toast('框內沒有內容');words=p;save();dirty=true;renderRows();toast(`已取代為 ${p.length} 組`)};
$('bulkExport').onclick=()=>{$('bulk').value=words.map(w=>w.zh+','+w.zy).join('\n')};
/* ---------- game ---------- */
function lines(n){const L=[];for(let r=0;r<n;r++){L.push([...Array(n)].map((_,c)=>r*n+c));L.push([...Array(n)].map((_,c)=>c*n+r))}L.push([...Array(n)].map((_,i)=>i*n+i));L.push([...Array(n)].map((_,i)=>i*n+(n-1-i)));return L}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function newRound(){
 const n=G.size,v=valid();
 closeAll();
 if(v.length<n*n){
  if(n===4&&v.length>=9){G.size=3;saveG();toast('單字不足 16 個，已切回 3×3');return newRound()}
  st={cells:[],marks:[],turn:G.starter,over:true,cur:-1,fangCell:{}};
  $('warn').innerHTML=`單字只有 ${v.length} 個，至少需要 9 個才能開始。<br><button class="pri" style="margin-top:10px" onclick="tab('edit')">✏️ 去新增單字</button>`;
  $('warn').classList.remove('hidden');render();return;
 }
 $('warn').classList.add('hidden');
 st={cells:shuffled(v).slice(0,n*n),marks:Array(n*n).fill(''),turn:G.starter,over:false,cur:-1,fangCell:{}};
 render();
}
function render(){
 const n=G.size,b=$('board');
 b.className='board n'+n;
 b.innerHTML=st.cells.map((w,i)=>{const m=st.marks[i];return `<button class="cell${m?' done m'+m.toLowerCase():''}" data-c="${i}" ${m?'aria-disabled="true"':''}><span class="w">${esc(w.zh)}</span>${m?`<span class="mk">${m}</span>`:''}${st.fangCell[i]?'<span class="fw" title="老師放水">😉</span>':''}</button>`}).join('');
 $('sz3').classList.toggle('on',n===3);$('sz4').classList.toggle('on',n===4);
 $('nO').value=G.names.O;$('nX').value=G.names.X;
 $('sO').textContent=G.score.O;$('sX').textContent=G.score.X;$('fsN').textContent=G.fang;
 $('tO').classList.toggle('turn',!st.over&&st.turn==='O');$('tX').classList.toggle('turn',!st.over&&st.turn==='X');
 const t=$('turn');
 if(!st.cells.length)t.textContent='';
 else if(st.over)t.innerHTML=st.winner?`🏆 <b class="${st.winner.toLowerCase()}">${esc(lab(st.winner))}</b> 贏了這一局！`:'🤝 平手！按「下一局」再來';
 else t.innerHTML=`輪到 <b class="${st.turn.toLowerCase()}">${esc(lab(st.turn))}</b>，請選一格`;
}
$('board').addEventListener('click',e=>{const c=e.target.closest('.cell');if(!c||st.over)return;const i=+c.dataset.c;if(st.marks[i])return;openCell(i)});
function openCell(i){
 st.cur=i;const w=st.cells[i];
 $('mWho').innerHTML=`<span style="color:var(--${st.turn.toLowerCase()})">${esc(lab(st.turn))}</span>`;
 $('mZh').textContent=w.zh;
 $('mAns').innerHTML='<button class="reveal" id="mReveal">👀 看答案</button>';
 $('modal').querySelector('.mbox').style.borderColor=st.turn==='O'?'var(--o)':'var(--x)';
 $('modal').classList.remove('hidden');
}
$('mAns').addEventListener('click',e=>{if(e.target.id!=='mReveal')return;const w=st.cells[st.cur],z=(w.zy||'').trim();
 $('mAns').innerHTML=(z&&z!==PH)?`<span class="zy">${esc(z)}</span>`:`<span class="zy empty">（這個字還沒有填入族語，請老師判斷 🙂）</span>`});
function closeModal(){$('modal').classList.add('hidden');st.cur=-1}
function clearConfetti(){document.querySelectorAll('.cf').forEach(d=>d.remove())}
function closeAll(){clearConfetti();closeModal();$('winOv').classList.add('hidden')}
function lab(t){const n=G.names[t];return n.toUpperCase().includes(t)?n:t+'・'+n}
function other(t){return t==='O'?'X':'O'}
function mark(fang){
 const i=st.cur;if(i<0)return;
 st.marks[i]=st.turn;if(fang){st.fangCell[i]=1;G.fang++;saveG()}
 closeModal();
 const n=G.size,win=lines(n).find(l=>l.every(k=>st.marks[k]===st.turn));
 if(win){st.over=true;st.winner=st.turn;G.score[st.turn]++;G.starter=other(G.starter);saveG();render();win.forEach(k=>$('board').children[k].classList.add('win'));setTimeout(()=>showWin(st.winner),900);return}
 if(st.marks.every(Boolean)){st.over=true;st.winner=null;G.starter=other(G.starter);saveG();render();setTimeout(()=>showWin(null),600);return}
 st.turn=other(st.turn);render();
}
$('mOk').onclick=()=>mark(false);
$('mSoft').onclick=()=>{mark(true)};
$('mNo').onclick=()=>{closeModal();st.turn=other(st.turn);render();toast('沒關係！換 '+G.names[st.turn]+' 挑戰')};
$('mClose').onclick=closeModal;
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function showWin(w){
 if(!st.over)return;
 if(w){$('wTitle').innerHTML=`<div class="emo">🎉</div><b style="color:var(--${w.toLowerCase()})">${esc(lab(w))}</b> 獲勝！`;$('wSub').textContent=`比分　${G.names.O} ${G.score.O} : ${G.score.X} ${G.names.X}`;confetti()}
 else{$('wTitle').innerHTML='<div class="emo">🤝</div>平手！';$('wSub').innerHTML=`格子都畫滿了，大家都很棒！<br>比分　${esc(G.names.O)} ${G.score.O} : ${G.score.X} ${esc(G.names.X)}`}
 $('winOv').classList.remove('hidden');
}
function confetti(){const cs=['#c0603a','#2f6d8a','#e8b923','#5b8c4a','#a3b86c','#c97b4a'];for(let k=0;k<80;k++){const d=document.createElement('div');d.className='cf';d.style.left=Math.random()*100+'vw';d.style.background=cs[k%cs.length];d.style.animationDuration=(1.8+Math.random()*1.8)+'s';d.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}}
$('wNext').onclick=newRound;$('wLook').onclick=()=>$('winOv').classList.add('hidden');
$('nextRound').onclick=()=>{if(!st.over&&st.marks.some(Boolean)&&!confirm('這一局還沒結束，要直接開始下一局嗎？（不計分）'))return;newRound()};
$('reshuffle').onclick=()=>{if(!st.over&&st.marks.some(Boolean)&&!confirm('換一批單字會清掉目前棋盤上的記號，確定嗎？'))return;newRound();toast('已換一批新單字')};
$('resetScore').onclick=()=>{if(!confirm('確定把比分和放水次數歸零？'))return;G.score={O:0,X:0};G.fang=0;saveG();render()};
function setSize(n){if(G.size===n)return;if(n===4&&valid().length<16)return toast(`4×4 需要 16 個單字，目前只有 ${valid().length} 個`);if(!st.over&&st.marks.some(Boolean)&&!confirm('切換大小會重新開一局，確定嗎？'))return;G.size=n;saveG();newRound()}
$('sz3').onclick=()=>setSize(3);$('sz4').onclick=()=>setSize(4);
['O','X'].forEach(t=>$('n'+t).addEventListener('input',e=>{G.names[t]=e.target.value.trim()||t+' 隊';saveG();const tl=$('turn');if(!st.over&&st.cells.length)tl.innerHTML=`輪到 <b class="${st.turn.toLowerCase()}">${esc(lab(st.turn))}</b>，請選一格`}));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('modal').classList.contains('hidden'))closeModal();else $('winOv').classList.add('hidden')}});
/* ---------- tabs ---------- */
function tab(t){clearConfetti();$('edit').classList.toggle('hidden',t!=='edit');$('game').classList.toggle('hidden',t!=='game');$('tabEdit').classList.toggle('on',t==='edit');$('tabGame').classList.toggle('on',t==='game');if(t==='game'&&(dirty||!st.cells.length)){dirty=false;newRound()}}
$('tabEdit').onclick=()=>tab('edit');$('tabGame').onclick=()=>tab('game');$('goGame').onclick=()=>{dirty=true;tab('game')};
$('fsBtn').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()};
renderRows();newRound();tab('game');
</script>
</body>
</html>
